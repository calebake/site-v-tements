<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Formulaire</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
   
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
 <link rel="stylesheet" href="./formulaire.css">
</head>
<body>


<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="form-card">
                <h2 class="text-center mb-4 fw-bold">Contactez-nous</h2>

                <form class="needs-validation" novalidate>
                    
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="nom" placeholder="Nom" required>
                        <label for="nom">Nom complet</label>
                        <div class="invalid-feedback">
                            Veuillez entrer votre nom.
                        </div>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="Email" required>
                        <label for="email">Adresse email</label>
                        <div class="invalid-feedback">
                            Email invalide.
                        </div>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="sujet" placeholder="Sujet" required>
                        <label for="motif">motif</label>
                        <div class="invalid-feedback">
                            Veuillez renseigner le sujet.
                        </div>
                    </div>

                    <div class="form-floating mb-4">
                        <textarea class="form-control" placeholder="Message" id="message" style="height: 120px" required></textarea>
                        <label for="message">Message</label>
                        <div class="invalid-feedback">
                            Le message est requis.
                        </div>
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-orange  btn-lg" type="submit">
                            Envoyer le message
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>




<footer class="footer mt-5">
    <div class="container">
        <div class="row py-4 align-items-center">
            
            <!-- Texte -->
            <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                <span class="text-light">
                    © 2026 — Tous droits réservés
                </span>
            </div>

            <!-- Liens -->
            <div class="col-md-6 text-center text-md-end">
                <a href="#" class="footer-link me-3">Mentions légales</a>
                <a href="#" class="footer-link me-3">Politique de confidentialité</a>
                <a href="./contacts.html" class="footer-link">Contact</a>
            </div>

        </div>
    </div>
</footer>







 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


<script>
(() => {
    'use strict'
    const forms = document.querySelectorAll('.needs-validation')

    Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
            }
            form.classList.add('was-validated')
        }, false)
    })
})()
</script>



</body>
</html>
